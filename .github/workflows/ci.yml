# CI: runs on every push to main and on pull requests.
# The release workflow (release.yml) is separate and triggers on v* tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # Runs the same suite on a real Windows host. Cross-compiling for windows
  # (see the build job) only proves the code compiles; it cannot catch
  # behavior that differs at runtime, which is how a config-permission check
  # that rejects every Windows file shipped in release archives unnoticed.
  # Tests asserting unix permission bits skip themselves on windows.
  test-windows:
    name: Test (Go, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # v7+ of the action is required to run golangci-lint v2, which is what
      # our .golangci.yml (version: "2") targets; v6 only supports v1.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  build:
    name: Build (embedded binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Builds the frontend (incl. vue-tsc type-check) and copies it into
      # web/dist so the -tags embed build below can go:embed a real UI.
      - name: Build frontend + embed
        run: make embed-frontend
      - name: Build embedded binary
        run: go build -tags embed -o /dev/null ./cmd/yolorouter
      - name: Cross-compile check (windows)
        run: GOOS=windows GOARCH=amd64 go build ./...
